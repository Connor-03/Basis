name: build

# Every push: test on Linux and Windows, build the Windows installer, install it on a real Windows desktop and check it.
# A tag like v1.2.3 also publishes a release with the installer, the update package and their checksums.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: End-to-end test
        run: python -B -X utf8 tools/smoke.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the program files and fetch the bundled Python
        run: python -B -X utf8 tools/build_release.py --python 3.12.10
      - name: End-to-end test on the bundled Python
        run: python -B -X utf8 tools/smoke.py --stage dist/stage/app --python dist/stage/python/python.exe
      - name: Build the installer
        shell: pwsh
        run: |
          $env:BASIS_VERSION = (Get-Content VERSION).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc packaging\windows\basis.iss
          if ($LASTEXITCODE) { throw 'installer build failed' }
          python -B tools/build_release.py --sums
      - name: Install it and check it on this desktop
        shell: pwsh
        run: |
          Start-Process dist\Basis-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          ./packaging/windows/test-install.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basis-windows
          path: |
            dist/Basis-Setup.exe
            dist/basis-*-app.zip
            dist/SHA256SUMS.txt
            dist/shots/
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION).Trim()
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "the tag $env:GITHUB_REF_NAME does not match VERSION $v" }
          python -B -X utf8 tools/release_notes.py $v > notes.md
          gh release create $env:GITHUB_REF_NAME dist/Basis-Setup.exe "dist/basis-$v-app.zip" dist/SHA256SUMS.txt --title "Basis $v" --notes-file notes.md
