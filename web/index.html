<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basis</title>
<meta name="theme-color" content="#0A0A14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Basis">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections">
    <div class="brand"><img src="/static/icon.svg" alt="" width="30" height="30"><span>Basis</span></div>
    <a href="/" data-page="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
    <a href="/positions" data-page="positions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg><span>Positions</span></a>
    <a href="/options" data-page="options"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9m4 0h3M4 12h3m4 0h9M4 18h11m4 0h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Options</span></a>
    <a href="/income" data-page="income"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1 1.8 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v12"/></svg><span>Income</span></a>
    <a href="/analysis" data-page="analysis"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6M2.5 20h19"/></svg><span>Analysis</span></a>
    <a href="/market" data-page="market"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><span>Market</span></a>
    <a href="/risk" data-page="risk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"/><path d="m12 17 4-6"/><path d="M4 20h16"/></svg><span>Margin</span></a>
    <hr>
    <a href="/assets" data-page="assets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.5A8.5 8.5 0 1 1 10.5 3.5v10z"/><path d="M14 3.2a8.5 8.5 0 0 1 6.8 6.8H14z"/></svg><span>Assets dashboard</span></a>
    <a href="/doom" data-page="doom"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c.6 3.2 4.5 4.8 4.5 9.5a4.5 4.5 0 0 1-9 0c0-1.7.6-2.9 1.7-4 .2 1.4.8 2.2 1.6 2.8C10.4 8.6 11 5.4 12 3z"/></svg><span>Doom dashboard</span></a>
    <hr>
    <a href="/activity" data-page="activity"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Activity</span></a>
    <a href="/settings" data-page="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V5.5"/><path d="M4 12v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V12"/></svg><span>Data and settings</span></a>
    <a href="/customize" data-page="customize"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M8.5 9.5h7M8.5 12.5h4"/></svg><span>Customize</span></a>
  </nav>
  <div class="content">
    <header class="top">
      <img class="brand-m" src="/static/icon.svg" alt="Basis" width="30" height="30">
      <form class="search" id="searchForm" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input type="text" id="searchBox" list="searchList" placeholder="Search a symbol" aria-label="Search a symbol" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <datalist id="searchList"></datalist>
      </form>
      <div class="sp"></div>
      <div class="sync" id="syncInfo"></div>
      <div class="busy" id="busyInfo" hidden><i></i>Updating</div>
      <button type="button" class="updbtn" id="updateBtn" hidden title="A new version of Basis"></button>
      <button type="button" class="iconbtn" id="censorBtn" aria-pressed="false" title="Hide dollar amounts">
        <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16"/><path d="M9.5 5.9A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.8M6.2 7.6A17 17 0 0 0 2.5 12S6 18.5 12 18.5c1.3 0 2.5-.3 3.6-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
    </header>
    <main id="main" tabindex="-1"><div class="loading">Loading</div></main>
  </div>
  <nav class="tabbar" aria-label="Sections">
    <a href="/" data-page="home">Home</a>
    <a href="/positions" data-page="positions">Positions</a>
    <a href="/options" data-page="options">Options</a>
    <a href="/income" data-page="income">Income</a>
    <button type="button" id="moreBtn" data-page="more">More</button>
  </nav>
</div>
<div class="sheet-back" id="sheetBack" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>
<div class="tip" id="tip" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
